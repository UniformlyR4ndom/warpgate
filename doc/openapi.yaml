openapi: "3.0.3"

info:
  title: Warpgate
  description: |
    Warpgate is a file server designed to bypass restrictive web proxies that inspect traffic content.
    Files are served through a configurable transform that disguises the content; the browser-based
    frontend reverses the transform to recover the original bytes. Uploads work in reverse: the
    frontend applies the transform, the server reverses it.

    The server also provides a clipboard API for storing and retrieving short text notes, backed by
    a local SQLite database (`warpgate.sqlite` by default, configurable with `-db`).
  version: "1.0.0"

servers:
  - url: /
    description: Warpgate server

security:
  - ApiKey: []

components:

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Auth
      description: |
        Authentication key. Configured with `-auth-key` at startup; if omitted, a random 32-byte
        hex key is auto-generated and printed to the server log. Disable auth entirely with
        `-no-auth`, in which case the header is not checked.

  schemas:

    ListEntry:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: File or directory name (no path separator).
          example: report.pdf
        type:
          type: string
          enum: [f, d]
          description: "'f' for file, 'd' for directory."
        size:
          type: integer
          format: int64
          description: Size in bytes. Present for files only; omitted for directories.
          example: 1048576

    UploadResponse:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Filename as stored on the server.
          example: document.bin

    TransformArgs:
      type: object
      description: |
        Transform-specific arguments. The schema depends on the accompanying `transform` field:

        **`id`** — No arguments (empty object or omit the field).

        **`xor`** — `{"key": "<hex>"}`: hex-encoded XOR key, any length, applied cyclically.

        **`aes-ctr`** — `{"key": "<hex>", "iv": "<hex>"}`: hex-encoded AES key (16, 24, or 32 bytes)
        and IV (exactly 16 bytes).

        **`pdf`** — `{"filename": "<name>", "password": "<hex>"}`: attachment filename embedded in
        the PDF (defaults to `"attachment"`); optional hex password enables AES-256 PDF encryption
        (download path only — `pdf-lib` used for upload encoding does not support encryption).

        **`html-b64`** — `{"key": "<hex>"}`: hex-encoded XOR key, exactly 16 bytes. Data is XOR-ed
        then base64-encoded and embedded in an HTML `<img>` tag.

    ClipItem:
      type: object
      required: [id, ts, data]
      properties:
        id:
          type: integer
          format: int64
          description: Sequential database ID.
          example: 42
        ts:
          type: integer
          format: int64
          description: Unix timestamp of when the note was created or last edited.
          example: 1751400000
        data:
          type: string
          format: byte
          description: Note content, base64-encoded.
          example: SGVsbG8gd29ybGQh

    ClipNewResponse:
      type: object
      required: [id, ts]
      properties:
        id:
          type: integer
          format: int64
          description: Database ID of the newly created note.
          example: 42
        ts:
          type: integer
          format: int64
          description: Unix timestamp assigned to the note.
          example: 1751400000

paths:

  /api/public/checkin:
    get:
      operationId: checkin
      summary: Log client check-in
      description: |
        Logs the client's remote IP address server-side. Called once on page load.
        Does not require authentication.
      security: []
      responses:
        "204":
          description: Check-in recorded.

  /api/files/list:
    post:
      operationId: listFiles
      summary: List directory contents
      description: |
        Returns the files and subdirectories at `path` within the download root.
        Use an empty string for the root itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Subdirectory path relative to the download root.
                  default: ""
            examples:
              root:
                summary: List root
                value:
                  path: ""
              subdir:
                summary: List subdirectory
                value:
                  path: docs/reports
      responses:
        "200":
          description: Directory listing (files and directories).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListEntry'
              example:
                - name: subdir
                  type: d
                - name: report.pdf
                  type: f
                  size: 204800
        "400":
          description: Invalid or path-traversal path.
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: Path not found.
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error.

  /api/files/download:
    post:
      operationId: downloadFileChunk
      summary: Download a file chunk
      description: |
        Downloads a byte range of a file with a transform applied. The response body is the raw
        transform output; the client must reverse the transform to recover the original bytes.

        Set `start=0` and `size` equal to the full file size to download in a single request.
        For chunked downloads, issue multiple requests with successive `start` offsets; `size`
        for the last chunk may be smaller than the others.

        The `args` field must match the chosen `transform`; see the `TransformArgs` schema for
        per-transform details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, start, size, transform]
              properties:
                path:
                  type: string
                  description: Path to the file, relative to the download root.
                  example: docs/report.pdf
                start:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Byte offset to begin reading from.
                  example: 0
                size:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Number of bytes to read. Must be positive.
                  example: 1048576
                transform:
                  type: string
                  enum: [id, xor, aes-ctr, pdf, html-b64]
                  description: Transform to apply before sending.
                  example: aes-ctr
                args:
                  $ref: '#/components/schemas/TransformArgs'
            examples:
              id:
                summary: No transform
                value:
                  path: file.bin
                  start: 0
                  size: 1048576
                  transform: id
                  args: {}
              xor:
                summary: XOR
                value:
                  path: file.bin
                  start: 0
                  size: 1048576
                  transform: xor
                  args:
                    key: deadbeefcafe1234
              aes-ctr:
                summary: AES-CTR
                value:
                  path: file.bin
                  start: 0
                  size: 1048576
                  transform: aes-ctr
                  args:
                    key: 00112233445566778899aabbccddeeff
                    iv: 0102030405060708090a0b0c0d0e0f10
              pdf:
                summary: PDF (with password)
                value:
                  path: file.bin
                  start: 0
                  size: 1048576
                  transform: pdf
                  args:
                    filename: file.bin
                    password: a1b2c3d4e5f6a7b8c9d0
              html-b64:
                summary: HTML/Base64
                value:
                  path: file.bin
                  start: 0
                  size: 1048576
                  transform: html-b64
                  args:
                    key: 00112233445566778899aabbccddeeff
      responses:
        "200":
          description: |
            Transformed file data. The `Content-Type` depends on the transform:
            `text/html; charset=utf-8` for `html-b64`, `application/octet-stream` for all others.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
        "400":
          description: |
            Invalid request — malformed JSON, path traversal, non-positive `size`, unknown
            transform name, or invalid transform args (e.g. wrong key length).
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: File not found.
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error (I/O error or transform failure).

  /api/files/upload:
    post:
      operationId: uploadFile
      summary: Upload a file
      description: |
        Accepts a file that has already been encoded by the client using the specified transform.
        The server reverses the transform and writes the recovered bytes to the upload root.

        This endpoint is only available when the server was started with `-ul-root`.
        If not configured, the endpoint returns 404.

        The request is a `multipart/form-data` with two parts:

        - **`transform`** (optional file part, `application/json`): describes the transform used
          to encode the file: `{"transform":"<name>","args":{...}}`. Omit to use the `id`
          (no-op) transform.
        - **`file`**: the encoded file data. The part's filename is used as the stored filename.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                transform:
                  type: string
                  description: |
                    JSON transform spec: `{"transform":"<name>","args":{...}}`.
                    See `TransformArgs` for per-transform arg schemas.
                  example: '{"transform":"xor","args":{"key":"deadbeefcafe1234"}}'
                file:
                  type: string
                  format: binary
                  description: Encoded file data. The multipart filename becomes the stored filename.
      responses:
        "201":
          description: File stored successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        "400":
          description: |
            Invalid request — malformed multipart form, invalid transform spec JSON, invalid
            transform args, or unusable filename.
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: Upload not configured (server started without `-ul-root`).
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error (transform failure or I/O error).

  /api/sim/download:
    post:
      operationId: simDownload
      summary: Download a chunk of a synthesized file (benchmark)
      description: |
        Returns a byte range of a synthesized file, for probing whether a given network path
        (proxy, etc.) tolerates a transfer of a given size — without touching the filesystem or
        applying any transform.

        The synthesized file's content is `<totalSize-as-decimal><space><0xFF padding>`, out to
        `totalSize` bytes total. `totalSize` must be large enough for its own decimal
        representation plus the space to fit (e.g. `totalSize: 1` is rejected), and at most 100 MiB
        (104857600 bytes).

        As with `/api/files/download`, set `start=0` and `size` equal to `totalSize` for a single
        request, or issue multiple requests with successive `start` offsets to simulate a chunked
        transfer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totalSize, start, size]
              properties:
                totalSize:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 104857600
                  description: Total size of the synthesized file, in bytes.
                  example: 1048576
                start:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Byte offset to begin reading from.
                  example: 0
                size:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Number of bytes to read. Must be positive.
                  example: 1048576
            example:
              totalSize: 1048576
              start: 0
              size: 1048576
      responses:
        "200":
          description: Chunk of the synthesized file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Invalid request — malformed JSON, `totalSize` out of range or too small to fit its own
            header, negative `start`, or non-positive `size`.
        "401":
          description: Missing or invalid `X-Auth` header.
        "405":
          description: Method not allowed.

  /api/sim/upload:
    post:
      operationId: simUpload
      summary: Upload a file for hashing (benchmark)
      description: |
        Accepts a file the same way `/api/files/upload` does, but never writes it to disk: the
        received bytes are hashed with SHA-256 and the hash is returned, so a client can verify a
        benchmark upload arrived intact without the server needing storage for it. No transform is
        applied.

        This endpoint is only available when the server was started with `-ul-root`
        (matching `/api/files/upload`'s gating), even though nothing is written to disk. If not
        configured, the endpoint returns 404. The upload is capped at 100 MiB (104857600 bytes).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: File data to hash.
      responses:
        "200":
          description: File received and hashed successfully.
          content:
            application/json:
              schema:
                type: object
                required: [hash]
                properties:
                  hash:
                    type: string
                    description: SHA-256 hash of the received bytes, hex-encoded.
                    example: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1
        "400":
          description: Invalid request — malformed multipart form or file exceeds 100 MiB.
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: Upload not configured (server started without `-ul-root`).
        "405":
          description: Method not allowed.

  /api/files/ul-list:
    get:
      operationId: listUploads
      summary: List uploaded files
      description: |
        Returns the files present in the upload directory. Only files are listed;
        subdirectories are excluded.

        This endpoint is only available when the server was started with `-ul-root`.
        If not configured, the endpoint returns 404.
      responses:
        "200":
          description: List of uploaded files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListEntry'
              example:
                - name: uploaded_file.bin
                  type: f
                  size: 512000
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: Upload not configured (server started without `-ul-root`).
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error.

  /api/clip/list:
    get:
      operationId: listClipboard
      summary: List clipboard notes
      description: |
        Returns all notes currently stored in the clipboard, ordered by insertion sequence.
        Returns an empty array when no notes exist.
      responses:
        "200":
          description: Array of clipboard notes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClipItem'
              example:
                - id: 1
                  ts: 1751400000
                  data: SGVsbG8gd29ybGQh
        "401":
          description: Missing or invalid `X-Auth` header.
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error.

  /api/clip/new:
    post:
      operationId: newClipboardNote
      summary: Create a clipboard note
      description: |
        Stores a new note in the clipboard database. The `data` field must be the note content
        base64-encoded. The server records the current Unix timestamp at insertion time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  format: byte
                  description: Note content, base64-encoded.
                  example: SGVsbG8gd29ybGQh
            example:
              data: SGVsbG8gd29ybGQh
      responses:
        "200":
          description: Note created. Returns the assigned ID and timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipNewResponse'
              example:
                id: 42
                ts: 1751400000
        "400":
          description: Malformed JSON body or `data` is not valid base64.
        "401":
          description: Missing or invalid `X-Auth` header.
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error.

  /api/clip/edit:
    post:
      operationId: editClipboardNote
      summary: Edit a clipboard note
      description: |
        Replaces the content of an existing note and updates its timestamp to the current time.
        The `data` field must be the new note content base64-encoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, data]
              properties:
                id:
                  type: integer
                  format: int64
                  description: ID of the note to update.
                  example: 42
                data:
                  type: string
                  format: byte
                  description: New note content, base64-encoded.
                  example: VXBkYXRlZCBjb250ZW50
            example:
              id: 42
              data: VXBkYXRlZCBjb250ZW50
      responses:
        "204":
          description: Note updated successfully.
        "400":
          description: Malformed JSON body or `data` is not valid base64.
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: No note with the given ID exists.
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error.

  /api/clip/delete:
    delete:
      operationId: deleteClipboardNote
      summary: Delete a clipboard note
      description: Permanently removes a note from the clipboard by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: integer
                  format: int64
                  description: ID of the note to delete.
                  example: 42
            example:
              id: 42
      responses:
        "204":
          description: Note deleted successfully.
        "400":
          description: Malformed JSON body.
        "401":
          description: Missing or invalid `X-Auth` header.
        "404":
          description: No note with the given ID exists.
        "405":
          description: Method not allowed.
        "500":
          description: Internal server error.
