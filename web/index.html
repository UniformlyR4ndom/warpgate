<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Warpgate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body x-data="filesApp()">

  <header>
    <h1>Warpgate</h1>
    <nav class="breadcrumb" x-show="tab === 'download'">
      <span class="crumb" @click="navigateTo(-1)">root</span>
      <template x-for="(seg, i) in pathSegments" :key="i">
        <span>
          <span class="separator">/</span>
          <span class="crumb" @click="navigateTo(i)" x-text="seg"></span>
        </span>
      </template>
    </nav>
  </header>

  <div class="layout">

    <aside class="panel" :class="{'collapsed': !settings.panel.open}">
      <button class="panel-toggle" @click="settings.panel.open = !settings.panel.open" title="Toggle panel"
              x-text="settings.panel.open ? '◀' : '▶'"></button>

      <div class="panel-content" x-show="settings.panel.open">

        <section class="panel-section">
          <h2 class="section-header" @click="settings.panel.authOpen = !settings.panel.authOpen">
            <span class="section-arrow" x-text="settings.panel.authOpen ? '▾' : '▸'"></span>Auth
          </h2>
          <div x-show="settings.panel.authOpen">
            <label>Key (X-Auth header)</label>
            <div class="key-input-wrap">
              <input type="text" x-model="settings.auth.key"
                     placeholder="leave empty to skip" autocomplete="off"
                     :class="{'key-masked': !authShowKey}">
              <button type="button" class="key-toggle" @click="authShowKey = !authShowKey"
                      :title="authShowKey ? 'Hide key' : 'Show key'">👁</button>
            </div>
          </div>
        </section>

        <section class="panel-section" x-show="tab === 'download'">
          <h2 class="section-header" @click="settings.panel.chunkingOpen = !settings.panel.chunkingOpen">
            <span class="section-arrow" x-text="settings.panel.chunkingOpen ? '▾' : '▸'"></span>Chunking
          </h2>
          <div x-show="settings.panel.chunkingOpen">
            <label class="auto-label">
              <input type="checkbox" x-model="settings.chunking.enabled"> Enable chunking
            </label>
            <div x-show="settings.chunking.enabled">
              <label>Chunk size (MB)</label>
              <input type="number" x-model="settings.chunking.chunkSize" min="1">
              <label class="auto-label"
                     :class="{'disabled': !hasFileSystemAccess}"
                     :title="hasFileSystemAccess ? '' : 'File System Access API is required for efficient reassembly'">
                <input type="checkbox"
                       x-model="settings.chunking.reassemble"
                       :disabled="!hasFileSystemAccess"> Reassemble chunks
              </label>
            </div>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="section-header" @click="settings.panel.generalOpen = !settings.panel.generalOpen">
            <span class="section-arrow" x-text="settings.panel.generalOpen ? '▾' : '▸'"></span>General
          </h2>
          <div x-show="settings.panel.generalOpen">
            <label class="auto-label">
              <input type="checkbox" x-model="settings.autoRefresh"> Auto-refresh
            </label>
            <label class="auto-label">
              <input type="checkbox" x-model="settings.confirmDelete"> Confirm note delete
            </label>
            <div x-show="tab === 'download' || tab === 'upload'">
              <label>Backend</label>
              <select x-model="settings.backend" x-ref="backendSelect">
                <template x-for="b in backendTypes" :key="b.id">
                  <option :value="b.id" x-text="b.label"></option>
                </template>
              </select>
            </div>
            <div x-show="(tab === 'download' || tab === 'upload') && settings.backend === 'ws'">
              <label>WS frame size (KB)</label>
              <input type="number" x-model.number="settings.wsFrameSizeKB"
                     :min="wsFrameMinKB" :max="wsFrameMaxKB">
            </div>
          </div>
        </section>

        <section class="panel-section">
          <h2 class="section-header" @click="settings.panel.transformOpen = !settings.panel.transformOpen">
            <span class="section-arrow" x-text="settings.panel.transformOpen ? '▾' : '▸'"></span>Transform
          </h2>
          <div x-show="settings.panel.transformOpen">
            <label>Type</label>
            <select x-model="settings.transform.type" x-ref="transformTypeSelect">
              <template x-for="t in transformTypes" :key="t.id">
                <option :value="t.id" x-text="t.label"></option>
              </template>
            </select>

            <div x-show="settings.transform.type === 'xor'">
              <div class="auto-row">
                <label>Key (hex)</label>
                <label class="auto-label">
                  <input type="checkbox" x-model="settings.transform.xor.auto"
                         @change="onAutoChange('xor')"> auto
                </label>
              </div>
              <input type="text" x-model="settings.transform.xor.key"
                     :readonly="settings.transform.xor.auto"
                     :class="{'readonly': settings.transform.xor.auto}">
            </div>

            <div x-show="settings.transform.type === 'aes-ctr'">
              <div class="auto-row">
                <label>Key (hex, 32 bytes)</label>
                <label class="auto-label">
                  <input type="checkbox" x-model="settings.transform.aesCtr.autoKey"
                         @change="onAutoChange('aes-ctr-key')"> auto
                </label>
              </div>
              <input type="text" x-model="settings.transform.aesCtr.key"
                     :readonly="settings.transform.aesCtr.autoKey"
                     :class="{'readonly': settings.transform.aesCtr.autoKey}">
              <div class="auto-row">
                <label>IV (hex, 16 bytes)</label>
                <label class="auto-label">
                  <input type="checkbox" x-model="settings.transform.aesCtr.autoIv"
                         @change="onAutoChange('aes-ctr-iv')"> auto
                </label>
              </div>
              <input type="text" x-model="settings.transform.aesCtr.iv"
                     :readonly="settings.transform.aesCtr.autoIv"
                     :class="{'readonly': settings.transform.aesCtr.autoIv}">
            </div>

            <div x-show="settings.transform.type === 'pdf'">
              <label>Attachment name</label>
              <input type="text" x-model="settings.transform.pdf.filename" placeholder="attachment">
              <div class="auto-row" x-show="tab === 'download'">
                <label class="auto-label">
                  <input type="checkbox" x-model="settings.transform.pdf.password.enabled"> Password protect
                </label>
              </div>
            </div>
          </div>
        </section>

      </div>
    </aside>

    <main>
      <div class="tabs">
        <button class="tab-btn" :class="{'active': tab === 'download'}"   @click="setTab('download')">Download</button>
        <button class="tab-btn" :class="{'active': tab === 'upload'}"     @click="setTab('upload')">Upload</button>
        <button class="tab-btn" :class="{'active': tab === 'clipboard'}"  @click="setTab('clipboard')">Clipboard</button>
      </div>

      <div x-show="tab === 'download'">
        <div x-show="error" class="error" x-text="error"></div>
        <table x-show="!error">
          <thead>
            <tr><th>Name</th><th class="col-size">Size</th></tr>
          </thead>
          <tbody>
            <template x-if="pathSegments.length > 0">
              <tr class="entry dir" @click="navigateTo(pathSegments.length - 2)">
                <td><span class="icon">📁</span>..</td><td></td>
              </tr>
            </template>
            <template x-for="entry in entries" :key="entry.name">
              <tr :class="'entry ' + (entry.type === 'd' ? 'dir' : 'file')"
                  @click="entry.type === 'd' ? enterDir(entry.name) : downloadFile(entry)">
                <td>
                  <span class="icon" x-text="entry.type === 'd' ? '📁' : '📄'"></span><span x-text="entry.name"></span>
                </td>
                <td class="col-size" x-text="entry.type === 'f' ? formatSize(entry.size) : ''"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div x-show="tab === 'upload'">
        <div x-show="uploadError" class="error" x-text="uploadError"></div>
        <div class="drop-zone"
             @dragover.prevent
             @dragenter.prevent="$el.classList.add('drag-active')"
             @dragleave="if (!$event.relatedTarget || !$el.contains($event.relatedTarget)) $el.classList.remove('drag-active')"
             @drop.prevent="$el.classList.remove('drag-active'); uploadFiles($event.dataTransfer.files)">
          Drop files here or
          <button class="choose-btn" @click="triggerFileInput()">choose files</button>
          <input type="file" id="ulFileInput" style="display:none" multiple
                 @change="uploadFiles($event.target.files); $event.target.value = ''">
        </div>
        <table x-show="uploadEntries.length > 0">
          <thead>
            <tr><th>Name</th><th class="col-size">Size</th></tr>
          </thead>
          <tbody>
            <template x-for="entry in uploadEntries" :key="entry.name">
              <tr class="entry file">
                <td><span class="icon">📄</span><span x-text="entry.name"></span></td>
                <td class="col-size" x-text="formatSize(entry.size)"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <div x-show="!uploadError && uploadEntries.length === 0" class="upload-empty">No files uploaded yet.</div>
      </div>

      <div x-show="tab === 'clipboard'">
        <div x-show="clipError" class="error" x-text="clipError"></div>
        <div class="clip-compose">
          <textarea class="clip-textarea" x-model="clipText" x-ref="clipTextarea" placeholder="Type a note..."
                    @keydown.escape.prevent="cancelEdit()"></textarea>
          <div class="clip-btn-row">
            <button class="choose-btn" @click="submitClip()" :disabled="!clipText.trim()"
                    x-text="clipEditId !== null ? 'Update' : 'Submit'"></button>
            <button class="choose-btn" x-show="clipEditId !== null" @click="cancelEdit()">Cancel</button>
          </div>
        </div>
        <div class="clip-list">
          <template x-for="item in clipItems" :key="item.id">
            <div class="clip-item">
              <div class="clip-meta">
                <span class="clip-ts" x-text="formatTS(item.ts)"></span>
                <button class="clip-delete" @click="deleteClip(item.id)" title="Delete">✕</button>
              </div>
              <div class="clip-text" x-text="base64ToText(item.data)"></div>
              <div class="clip-footer">
                <button class="clip-copy clip-download" @click="downloadClip(item)" title="Download note">⬇</button>
                <button class="clip-copy" @click="copyClip(item.data)" title="Copy to clipboard">📋</button>
                <button class="clip-copy" @click="editClip(item)" title="Edit note">✏</button>
              </div>
            </div>
          </template>
          <div x-show="!clipError && clipItems.length === 0" class="upload-empty">No notes yet.</div>
        </div>
      </div>
    </main>

  </div>

  <script src="pdf.min.js"></script>
  <script src="pdf-lib.min.js"></script>
  <script src="aes.js"></script>
  <script src="app.js"></script>
  <script defer src="alpine.min.js"></script>
</body>
</html>
